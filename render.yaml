services:
  - type: web
    name: nextstep-journal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_TIMEZONE
        value: Asia/Kolkata
      - key: MONGOMS_DISABLE_POSTINSTALL
        value: "1"
      - key: MONGODB_URI
        sync: false
